<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Machine Editor</title>
    <link href="./css/style.css" rel="stylesheet">
    <script src="js/luaparse.js"></script>
</head>
<body>

<div id="top-bar">
    <div id="vm-status-label">🖥️ VM: Disconnected | 📁 -</div>

    <div class="program-settings">
        <label>Program : </label>
        <input id="program-name-input" placeholder="Enter file name..." type="text" value="boot">
    </div>
    <div class="header-actions">
        <select class="btn-secondary" id="template-select">
            <option value="">📝 Templates...</option>
        </select>

        <button class="btn-orange" id="explorer-btn">Explorer 📁</button>
        <button class="btn-primary" id="send-btn">Send 🚀</button>
    </div>
</div>

<div id="main-container">
    <div id="sidebar">
        <div class="sidebar-search">
            <input autocomplete="off" id="api-search-input" placeholder="🔍 Search..." type="text">
        </div>
        <div id="api-list"></div>
    </div>

    <div id="editor-area" style="flex: 1; display: block;">
        <div id="editor-container"></div>
    </div>
</div>

<div class="hidden" id="file-explorer-overlay">
    <div id="file-explorer-modal">
        <div class="explorer-header">
            <h3>📂 Workspace Explorer</h3>
            <div class="explorer-toolbar">
                <button class="btn-secondary" id="explorer-new-btn">New 📄</button>
                <button class="btn-secondary" id="explorer-delete-btn">Delete 🗑️</button>
            </div>
        </div>
        <div id="file-tree"></div>
        <div class="modal-footer">
            <button class="btn-secondary" id="explorer-close-btn">Close</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<!-- JS側でモードを判定するためのグローバル変数 -->
<script>window.EDITOR_TYPE = 'machine';</script>

<script src="./vs/loader.js"></script>
<script>
    require.config({paths: {'vs': './vs'}});
</script>
<script src="js/main.js" type="module"></script>
</body>
</html>
